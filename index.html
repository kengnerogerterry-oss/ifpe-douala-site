<!-- [SÉCURITÉ] Politique de sécurité du contenu (CSP) : seuls les scripts du site (et le script anti-flash, identifié par son empreinte)
     peuvent s'exécuter ; aucune connexion réseau, aucun objet/iframe externe ; seules les polices Google sont autorisées.
     Si vous modifiez le script inline du <head>, recalculez son empreinte sha256 (sinon le thème ne s'applique plus). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-jA7/HYOOzVuMak6NJkFyIQHruXzjOYBT2rO/OiNEGzY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

<meta name="theme-color" content="#1a6bbd">
<!-- [MODIF 2 – MODE SOMBRE] Appliqué AVANT le premier affichage (évite le flash blanc) :
     thème enregistré (localStorage « ifpe-theme ») sinon préférence système. Le bouton et la persistance sont dans js/theme.js -->
<script>(function(){var t=null;try{t=localStorage.getItem('ifpe-theme')}catch(e){}
if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
document.documentElement.setAttribute('data-theme',t);
var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#0b1522':'#1a6bbd')})();</script>
